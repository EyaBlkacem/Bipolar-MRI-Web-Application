<div class="login-page">
  <div class="bg-shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
  </div>

  <div class="login-wrapper">

   
    <div class="login-left">
      <div class="branding">
        <div class="brand-logo">🧠</div>
        <h1 class="brand-title">PsychoCare</h1>
        <p class="brand-desc">
          Plateforme de gestion des consultations psychiatriques.
          Sécurisée, intuitive et efficace.
        </p>

        <div class="brand-features">
         
          <div class="feature-item">
            <i class="bi bi-calendar-check-fill"></i>
            <span>Gestion des rendez-vous</span>
          </div>
          <div class="feature-item">
            <i class="bi bi-people-fill"></i>
            <span>Suivi des patients</span>
          </div>
          <div class="feature-item">
            <i class="bi bi-geo-alt-fill"></i>
            <span>Localisation des psychiatres</span>
          </div>
        </div>
      </div>
    </div>

    <div class="login-right">
      <div class="login-card">

        <div class="login-card-header">
          <h3 class="login-card-title">Connexion</h3>
          <p class="login-card-sub">
            Bienvenue ! Entrez vos identifiants.
          </p>
        </div>

        <div class="error-alert" *ngIf="errorMessage">
          <i class="bi bi-exclamation-circle-fill me-2"></i>
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()">

          <div class="form-group">
            <label class="form-label-custom">Identifiant</label>
            <div class="input-wrapper">
              <i class="bi bi-person-fill input-icon"></i>
              <input type="text" class="input-custom"
                     [(ngModel)]="username" name="username"
                     placeholder="Votre identifiant"
                     required autocomplete="username" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label-custom">Mot de passe</label>
            <div class="input-wrapper">
              <i class="bi bi-lock-fill input-icon"></i>
              <input [type]="showPassword ? 'text' : 'password'"
                     class="input-custom"
                     [(ngModel)]="password" name="password"
                     placeholder="••••••••"
                     required autocomplete="current-password" />
              <button type="button" class="eye-btn"
                      (click)="showPassword = !showPassword">
                <i class="bi"
                   [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'">
                </i>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="loading">
            <span *ngIf="loading"
                  class="spinner-border spinner-border-sm me-2"></span>
            <i class="bi bi-box-arrow-in-right me-2" *ngIf="!loading"></i>
            {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
          </button>

         
          <div class="register-link mt-3 text-center">
            <span style="color:#64748b; font-size:0.85rem;">
              Pas encore de compte ?
            </span>
            <a routerLink="/register"
               style="color:#1a2a5e; font-weight:700; font-size:0.85rem;
                      text-decoration:none; margin-left:6px;">
              <i class="bi bi-person-plus me-1"></i>S'inscrire
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>
